image: python:3.12

pipelines:
  custom:
    # ────────────────────────────────
    # One-time Bootstrap (NO oidc:true)
    # ────────────────────────────────
    Bootstrap-OIDC:
      - step:
          name: Bootstrap OIDC Provider + Role (one-time)
          script:
            - set -euo pipefail
            - pip install --upgrade pip awscli
            - : "Expect AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY / AWS_DEFAULT_REGION in repo variables"
            - aws sts get-caller-identity
            - bash deploy_cfn.sh "sbp-bitbucket-oidc-provider" \
                "configuration/cloudformation/bitbucket-oidc-provider-ecs.yml" \
                --capabilities CAPABILITY_NAMED_IAM
            - bash deploy_cfn.sh "sbp-bitbucket-oidc-role" \
                "configuration/cloudformation/bitbucket-oidc-role-ecs.yml" \
                --capabilities CAPABILITY_NAMED_IAM \
                --parameter-overrides RepoFullName="$BITBUCKET_REPO_FULL_NAME" BranchPattern="ref/heads/*"

    # ────────────────────────────────
    # Deploy Infra (S3 + Allure Hosting)
    # ────────────────────────────────
    Deploy-Infra:
      - step:
          name: Deploy public S3 website (CFN)
          oidc: true
          script:
            - set -euo pipefail
            - pip install --upgrade pip awscli
            - export AWS_ROLE_ARN="${BITBUCKET_AWS_ROLE_ARN:?Set BITBUCKET_AWS_ROLE_ARN repo var}"
            - export AWS_WEB_IDENTITY_TOKEN_FILE="$(pwd)/web-identity-token"
            - echo "$BITBUCKET_STEP_OIDC_TOKEN" > "$AWS_WEB_IDENTITY_TOKEN_FILE"
            - aws sts get-caller-identity
            - bash deploy_cfn.sh "sbp-allure-public" \
                "configuration/cloudformation/s3-allure-infra-ecs.yml" \
                --capabilities CAPABILITY_NAMED_IAM

    # ────────────────────────────────
    # Run UI Tests + Publish Allure
    # ────────────────────────────────
    Run-Tests:
      - variables:
          - name: APP
          - name: ENV
          - name: TAGS
          - name: HEADLESS
      - step:
          name: Run Behave + Allure + Publish + Email
          oidc: true
          caches:
            - pip
          script:
            - set -euo pipefail
            - pip install --upgrade pip awscli jq curl gnupg unzip
            - export AWS_ROLE_ARN="${BITBUCKET_AWS_ROLE_ARN:?Set BITBUCKET_AWS_ROLE_ARN repo var}"
            - export AWS_WEB_IDENTITY_TOKEN_FILE="$(pwd)/web-identity-token"
            - echo "$BITBUCKET_STEP_OIDC_TOKEN" > "$AWS_WEB_IDENTITY_TOKEN_FILE"
            - aws sts get-caller-identity

            # Install Chrome & JRE for Allure CLI
            - curl -fsSL https://dl.google.com/linux/linux_signing_key.pub | gpg --dearmor -o /usr/share/keyrings/google-linux-signing-keyring.gpg
            - echo "deb [arch=amd64 signed-by=/usr/share/keyrings/google-linux-signing-keyring.gpg] http://dl.google.com/linux/chrome/deb/ stable main" > /etc/apt/sources.list.d/google-chrome.list
            - apt-get update -y && apt-get install -y google-chrome-stable fonts-liberation default-jre-headless

            # Python deps
            - if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

            # Allure history seed
            - mkdir -p "reports/${APP}/allure-results/history"
            - aws s3 sync "s3://automation-testing-artifacts/${S3_PREFIX}/latest/history" "reports/${APP}/allure-results/history" --exact-timestamps || true

            # Run tests
            - python run_behave.py --app "$APP" --tags "$TAGS" --env "$ENV" --headless "$HEADLESS" || true

            # Allure generate
            - |
              if ! command -v allure >/dev/null 2>&1; then
                curl -sL https://github.com/allure-framework/allure2/releases/download/2.29.0/allure-2.29.0.tgz -o /tmp/allure.tgz
                tar -xzf /tmp/allure.tgz -C /tmp
                ln -s /tmp/allure-2.29.0/bin/allure /usr/local/bin/allure
              fi
            - allure generate "reports/${APP}/allure-results" --clean -o "reports/${APP}/allure-reports"

            # Publish
            - RUN_ID=$(date +%Y%m%d-%H%M%S)
            - TS="reports/${APP}/${RUN_ID}"
            - mkdir -p "$TS"
            - mv "reports/${APP}/allure-results" "$TS/"
            - mv "reports/${APP}/allure-reports" "$TS/"
            - aws s3 sync "$TS/allure-results" "s3://automation-testing-artifacts/${S3_PREFIX}/${RUN_ID}/allure-results" --delete
            - aws s3 sync "$TS/allure-reports" "s3://automation-testing-artifacts/${S3_PREFIX}/${RUN_ID}/allure-report" --delete
            - aws s3 sync "$TS/allure-reports" "s3://automation-testing-artifacts/${S3_PREFIX}/latest" --delete
            - aws s3 sync "$TS/allure-reports/history" "s3://automation-testing-artifacts/${S3_PREFIX}/latest/history" --delete

            # Email
            - REPORT_URL="http://automation-testing-artifacts.s3-website-${AWS_DEFAULT_REGION}.amazonaws.com/${S3_PREFIX}/latest/index.html"
            - SUBJECT="${SES_SUBJECT_PREFIX:-SeleniumBDDPython}: Report ${BITBUCKET_BRANCH} #${BITBUCKET_BUILD_NUMBER}"
            - RECIPS_JSON=$(python -c 'import os,json; print(json.dumps([a.strip() for a in os.environ.get("SES_TO","").split(",") if a.strip()]))')
            - BODY="Allure Report (public):\n${REPORT_URL}\n"
            - aws sesv2 send-email \
                --from-email-address "$SES_FROM" \
                --destination "ToAddresses=${RECIPS_JSON}" \
                --content "{\"Simple\":{\"Subject\":{\"Data\":\"$SUBJECT\",\"Charset\":\"UTF-8\"},\"Body\":{\"Text\":{\"Data\":\"$BODY\",\"Charset\":\"UTF-8\"}}}}"

          artifacts:
            - reports/**/*
            - logs/**/*

    # ────────────────────────────────
    # Deploy OIDC Role (no oidc:true)
    # ────────────────────────────────
    Deploy-OIDC-Role:
      - step:
          name: Deploy Bitbucket OIDC Role
          script:
            - set -euo pipefail
            - pip install --upgrade pip awscli
            - aws sts get-caller-identity
            - bash deploy_cfn.sh "sbp-bitbucket-oidc-role" \
                "configuration/cloudformation/bitbucket-oidc-role-ecs.yml" \
                --capabilities CAPABILITY_NAMED_IAM \
                --parameter-overrides RepoFullName="$BITBUCKET_REPO_FULL_NAME" BranchPattern="ref/heads/*"

    # ────────────────────────────────
    # Deploy OIDC Provider (no oidc:true)
    # ────────────────────────────────
    Deploy-OIDC-Provider:
      - step:
          name: Deploy Bitbucket OIDC Provider
          script:
            - set -euo pipefail
            - pip install --upgrade pip awscli
            - aws sts get-caller-identity
            - bash deploy_cfn.sh "sbp-bitbucket-oidc-provider" \
                "configuration/cloudformation/bitbucket-oidc-provider-ecs.yml" \
                --capabilities CAPABILITY_NAMED_IAM

definitions:
  caches:
    pip: ~/.cache/pip
