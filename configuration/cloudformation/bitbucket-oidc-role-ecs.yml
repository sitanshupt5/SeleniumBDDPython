AWSTemplateFormatVersion: "2010-09-09"
Description: IAM Role for Bitbucket Pipelines (trusts existing provider)

Parameters:
  ReportsBucketName:
    Type: String
    Default: automation-testing-artifacts

Resources:
  BitbucketPipelineRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: sbp-bitbucket-oidc-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: arn:aws:iam::${AWS::AccountId}:oidc-provider/api.bitbucket.org/2.0/workspaces/spt51992/pipelines-config/identity/oidc
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                "api.bitbucket.org/2.0/workspaces/spt51992/pipelines-config/identity/oidc:sub": "repo:${BITBUCKET_REPO_FULL_NAME}:ref:refs/heads/main"

      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonS3FullAccess
        - arn:aws:iam::aws:policy/AmazonSESFullAccess

Outputs:
  RoleArn:
    Value: !GetAtt BitbucketPipelineRole.Arn
    Export:
      Name: sbp-bitbucket-oidc-role-arn
