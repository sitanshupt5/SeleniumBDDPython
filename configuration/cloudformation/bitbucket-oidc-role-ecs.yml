AWSTemplateFormatVersion: "2010-09-09"
Description: IAM Role for Bitbucket Pipelines (trusts existing Bitbucket OIDC)

Parameters:
  ReportsBucketName:
    Type: String
    Default: automation-testing-artifacts
  RepoFullName:
    Type: String
    Description: Bitbucket repo full name, e.g., workspace/repo
    Default: spt51992/seleniumbddpython
  BranchPattern:
    Type: String
    Description: Branch or pattern, e.g., refs/heads/main or refs/heads/*
    Default: refs/heads/*

Resources:
  BitbucketPipelineRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: sbp-bitbucket-oidc-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub arn:aws:iam::${AWS::AccountId}:oidc-provider/api.bitbucket.org/2.0/workspaces/spt51992/pipelines-config/identity/oidc
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              # 1) audience must match your Bitbucket workspace audience
              StringEquals:
                api.bitbucket.org/2.0/workspaces/spt51992/pipelines-config/identity/oidc:aud: "ari:cloud:bitbucket::workspace/39c79d5f-e07d-4bc0-9107-bf39b0c24f41"
              # 2) lock to specific repo/branch (pattern allowed)
              StringLike:
                api.bitbucket.org/2.0/workspaces/spt51992/pipelines-config/identity/oidc:sub: !Sub "repo:${RepoFullName}:ref:${BranchPattern}"

      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonS3FullAccess
        - arn:aws:iam::aws:policy/AmazonSESFullAccess

Outputs:
  RoleArn:
    Value: !GetAtt BitbucketPipelineRole.Arn
