AWSTemplateFormatVersion: '2010-09-09'
Description: Public S3 website for Allure reports (always on)

Resources:
  ReportsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: automation-testing-artifacts
      VersioningConfiguration: { Status: Enabled }
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }

      # Website hosting: ALWAYS ON
      WebsiteConfiguration:
        IndexDocument: index.html
        ErrorDocument: index.html

      # Public site requires public access not to be blocked
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
        BlockPublicPolicy: false
        IgnorePublicAcls: false
        RestrictPublicBuckets: false

  BucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ReportsBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: PublicRead
            Effect: Allow
            Principal: "*"
            Action: s3:GetObject
            Resource: !Sub arn:aws:s3:::${ReportsBucket}/*

Outputs:
  BucketName:
    Value: !Ref ReportsBucket
  WebsiteURL:
    Value: !Sub http://${ReportsBucket}.s3-website-${AWS::Region}.amazonaws.com